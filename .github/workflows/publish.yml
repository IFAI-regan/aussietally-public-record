name: Publish public result snapshots
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-public-results
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch and verify public snapshots
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
          SNAPSHOT_EXCLUDED_ISSUES: ${{ vars.SNAPSHOT_EXCLUDED_ISSUES }}
        run: node publish.mjs
      - name: Publish complete verified batch
        run: |
          git config user.name 'AussieTally public record'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json snapshots/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish dated grouped result snapshots'
            git push
          fi
